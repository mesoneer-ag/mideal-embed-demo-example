name: Test Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, azure]
    steps:
      - name: System info
        run: |
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | grep Mem | awk '{print $2}')"

      - name: Tool versions
        run: |
          node --version || true
          java -version 2>&1 || true
          docker --version || true
          uv --version || true
          tofu --version || true

      - name: Network
        run: curl -sf -o /dev/null -w 'GitHub API HTTP %{http_code}\n' https://api.github.com
